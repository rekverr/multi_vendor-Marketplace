name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.15
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: ci-meilisearch-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -fsS http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://admin:ci-postgres-password@localhost:5432/marketplace?schema=public
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-meilisearch-key
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_SECONDS: 3600
      JWT_ISSUER: marketplace-api-ci
      JWT_AUDIENCE: marketplace-client-ci
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:5173/auth/google/callback
      GOOGLE_OAUTH_STATE_TTL_SECONDS: 600
      OUTBOX_PUBLISHER_ENABLED: "false"
      AUCTION_MAINTENANCE_ENABLED: "false"
      PLATFORM_COMMISSION_RATE: "0.100000"
      ORDER_CURRENCY: USD

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
      - run: npm run build-storybook

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build --target runtime -t marketplace-backend:ci backend
      - run: docker build --target runtime --build-arg VITE_API_URL=http://localhost:3000 -t marketplace-frontend:ci frontend
