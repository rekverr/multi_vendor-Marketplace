services:
  postgres:
    image: postgres:16-alpine
    container_name: marketplace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: marketplace

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: marketplace-meilisearch
    restart: unless-stopped

    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: change-me-meili-key

    ports:
      - "7700:7700"

    volumes:
      - meili_data:/meili_data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:7700/health | grep -q 'available'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  meili_data:
